name: Production Users Credentials

# Sincroniza operadores Millennium y resetea credenciales @axones.com en producción.
on:
  workflow_dispatch:

jobs:
  apply-users:
    name: Usuarios planta y credenciales
    runs-on: self-hosted
    steps:
      - name: Sincronizar usuarios y credenciales
        run: |
          cd /var/www/axones
          git fetch origin main
          git reset --hard origin/main
          cd backend
          echo "==> Operadores Millennium (idempotente)"
          php artisan db:seed --class=MillenniumProductionUsersSeeder --force --no-interaction
          echo "==> Victor y Valeria"
          php artisan db:seed --class=AxonesUsersSeeder --force --no-interaction
          echo "==> Migrar correos y contraseñas"
          php artisan axones:users:reset-credentials --no-interaction
