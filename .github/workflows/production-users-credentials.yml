name: Production Users Credentials

# Carga Victor/Valeria, operadores Millennium y resetea credenciales @axones.com.
on:
  workflow_dispatch:

jobs:
  apply-users:
    name: Usuarios planta y credenciales
    runs-on: self-hosted
    steps:
      - name: Aplicar seeders y reset de credenciales
        run: |
          cd /var/www/axones
          git fetch origin main
          git reset --hard origin/main
          cd backend
          echo "==> Usuarios base (Víctor, Valeria)"
          php artisan db:seed --class=AxonesUsersSeeder --force --no-interaction
          echo "==> Operadores Millennium"
          php artisan db:seed --class=MillenniumProductionUsersSeeder --force --no-interaction
          echo "==> Migrar correos y contraseñas"
          php artisan axones:users:reset-credentials --no-interaction
