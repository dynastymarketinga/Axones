name: Production DB Cleanup

# Solo limpieza puntual de BD. NO usar en deploys normales.
on:
  workflow_dispatch:

jobs:
  truncate-keep-auth:
    name: Limpiar BD producción (una vez)
    runs-on: self-hosted
    steps:
      - name: Vaciar tablas de negocio
        run: |
          cd /var/www/axones
          git fetch origin main
          git reset --hard origin/main
          cd backend
          echo "==> Limpieza BD: conserva users, sessions, personal_access_tokens, migrations"
          php artisan axones:truncate-keep-users --force --no-interaction
